<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS Сканер</title>
    <!-- Подключаем библиотеку для сканирования QR и Штрихкодов -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .container { max-width: 500px; width: 100%; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        
        h2 { text-align: center; color: #1e293b; margin-top: 0; }
        
        /* Область камеры */
        #reader { width: 100%; border-radius: 8px; overflow: hidden; background: #000; margin-bottom: 20px; }
        
        /* Результат сканирования */
        .scan-result { background: #dbeafe; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #bfdbfe; display: none; }
        .scan-result.active { display: block; animation: popIn 0.3s ease; }
        
        @keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; font-weight: bold; color: #64748b; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; transition: 0.2s; }
        
        .btn-in { background: #10b981; } /* Зеленый - Приемка */
        .btn-out { background: #ef4444; } /* Красный - Отгрузка */
        .btn-clear { background: #94a3b8; margin-top: 10px; width: 100%; }

        button:active { transform: scale(0.98); opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        #status { text-align: center; margin-top: 10px; font-size: 14px; min-height: 20px; }
        .loading { color: var(--primary); }
        .success { color: #10b981; }
        .error { color: #ef4444; }
    </style>
</head>
<body>

<div class="container">
    <h2>📦 Сканер склада</h2>
    
    <!-- Камера -->
    <div id="reader"></div>

    <!-- Форма товара -->
    <div id="product-form" class="scan-result">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <strong>Товар найден!</strong>
            <span style="font-size:12px; background:#fff; padding:2px 6px; border-radius:4px;" id="barcode-display"></span>
        </div>
        
        <div class="form-group">
            <label>Название товара</label>
            <input type="text" id="p-name" placeholder="Введите название...">
        </div>
        
        <div class="form-group">
            <label>Количество</label>
            <input type="number" id="p-qty" value="1">
        </div>

        <div class="btn-group">
            <button class="btn-in" onclick="sendData('Приёмка')">📥 Приёмка</button>
            <button class="btn-out" onclick="sendData('Отгрузка')">📤 Отгрузка</button>
        </div>
        
        <button class="btn-clear" onclick="resetScanner()">❌ Отмена / Следующий</button>
    </div>
    
    <div id="status">Ожидание сканирования...</div>
</div>

<script>
    // ==========================================
    // ВСТАВЬТЕ СЮДА ВАШУ ССЫЛКУ ИЗ ШАГА 1
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyW6RWkNOur9JmLI4RdcD-xbY6TtV1eR0f8K9Vppxr1wqg-IHXewN6OlQhHcXRNfgpJug/exec"; 
    // ==========================================

    let html5QrcodeScanner;
    let currentBarcode = "";

    function onScanSuccess(decodedText, decodedResult) {
        // Останавливаем сканирование после успеха
        html5QrcodeScanner.clear();
        
        currentBarcode = decodedText;
        document.getElementById('status').innerText = `Сканировано: ${decodedText}`;
        document.getElementById('status').className = '';
        
        // Показываем форму
        const form = document.getElementById('product-form');
        form.classList.add('active');
        document.getElementById('barcode-display').innerText = decodedText;
        
        // Фокус на поле названия
        document.getElementById('p-name').focus();
    }

    function onScanFailure(error) {
        // Игнорируем ошибки (они сыплются постоянно пока камера ищет код)
    }

    function startScanner() {
        html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", 
            { fps: 10, qrbox: {width: 250, height: 150}, aspectRatio: 1.0 },
            /* verbose= */ false
        );
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    }

    function resetScanner() {
        document.getElementById('product-form').classList.remove('active');
        document.getElementById('p-name').value = '';
        document.getElementById('p-qty').value = '1';
        document.getElementById('status').innerText = "Ожидание сканирования...";
        startScanner(); // Перезапускаем камеру
    }

    async function sendData(type) {
        const name = document.getElementById('p-name').value;
        const qty = document.getElementById('p-qty').value;
        const statusEl = document.getElementById('status');

        if (!name) { alert("Введите название товара!"); return; }

        statusEl.innerText = "Отправка данных...";
        statusEl.className = "loading";

        const payload = {
            barcode: currentBarcode,
            name: name,
            qty: qty,
            type: type
        };

        try {
            // Используем no-cors, так как Google Script не всегда отдает правильные заголовки для CORS
            // Но мы предполагаем, что скрипт настроен верно.
            await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors', 
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(payload)
            });

            statusEl.innerText = `✅ ${type} сохранена!`;
            statusEl.className = "success";
            
            // Звуковой сигнал успеха
            const audio = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');
            audio.play().catch(e => console.log('Audio play failed'));

            setTimeout(resetScanner, 1500);

        } catch (error) {
            console.error(error);
            statusEl.innerText = "Ошибка соединения!";
            statusEl.className = "error";
        }
    }

    // Запуск при загрузке
    window.onload = startScanner;
</script>

</body>
</html>
